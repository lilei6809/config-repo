# ============================================================
# edge-server.yml — 所有 profile 共用的基础配置
# 存放于 Git Config Repo 根目录
# ============================================================

server:
  shutdown: graceful
  port: 9000
  netty:
    connection-timeout: 2s
    idle-timeout: 10s
polar:
  greeting: "edge-server general config from GITHUB"

spring:
  application:
    name: edge-server

  lifecycle:
    timeout-per-shutdown-phase: 15s
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: catalog-service
              # URI 由环境变量注入; 本地 fallback 仅供 dev 使用
              uri: ${CATALOG_SERVICE_URL:http://localhost:9001}/books
              predicates:
                - Path=/books/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: catalogCircuitBreaker
                    fallbackUri: forward:/catalog-fallback

            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:9002}/orders
              predicates:
                - Path=/orders/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: orderCircuitBreaker

          httpclient:
            connect-timeout: 2000
            response-timeout: 2000
            pool:
              # type / max-connections 由各 profile 覆盖
              max-idle-time: 15s
              max-life-time: 60s

          default-filters:
            - name: Retry
              args:
                retries: 3
                methods: GET
                series: SERVER_ERROR
                exceptions:
                  - java.io.IOException
                  - java.util.concurrent.TimeoutException
                backoff:
                  firstBackOff: 50ms
                  maxBackOff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
                jitter:
                  randomFactor: 0.5

            - name: RequestRateLimiter
              args:
                redis-rate-limiter:
                  requestedTokens: 1
                  burstCapacity: 20
                  replenishRate: 10

            - name: SaveSession

  session:
    store-type: redis
    timeout: 10m
    redis:
      namespace: polar:edge

  data:
    redis:
      connect-timeout: 1s
      # host 由各 profile 覆盖
      port: 6379
      timeout: 1s

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        permitted-number-of-calls-in-half-open-state: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state:
          seconds: 15
  timelimiter:
    configs:
      default:
        timeout-duration:
          seconds: 3

management:
  endpoints:
    web:
      exposure:
        include: refresh,health
