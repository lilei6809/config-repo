
polar:
  greeting: "edge server k8s config from GITHUB"

# ============================================================
# edge-server-k8s.yml — Dev K8s 集群环境覆盖配置
# 定位: 部署到开发集群, 依赖通过 K8s Service DNS 访问
# 保持 debug 友好, 不做生产加固
# ============================================================

spring:
  cloud:
    config:
      # Dev K8s 集群里 Config Server 通常是稳定的, 但仍允许失败
      # 开发阶段不希望 Config Server 一挂就阻断所有服务启动
      fail-fast: false

    gateway:
      server:
        webflux:
          httpclient:
            pool:
              # Dev 集群流量小, elastic 足够, 方便调试
              type: elastic

  data:
    redis:
      # 通过 K8s Service DNS 访问集群内的 Redis
      host: ${DATA_REDIS_HOST:ploar-redis}

logging:
  level:
    io.github.resilience4j: DEBUG
    org.springframework.cloud.gateway: DEBUG

management:
  endpoints:
    web:
      exposure:
        # Dev 集群保留 refresh, 方便触发配置热更新
        include: refresh,health
  endpoint:
    health:
      probes:
        enabled: true       # 开启 liveness / readiness, K8s 探针需要
      show-details: always  # Dev 环境可以看健康详情, 方便排查






